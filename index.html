<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A5FC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diário de Viatura</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6;--surface:#FFFFFF;--ink:#1F2428;--muted:#5C6671;--line:#D7DCE1;
  --hydra:#4A5FC4;--hydra-ink:#FFFFFF;--hydra-soft:#E7EAF8;
  --ok:#2B7550;--ok-soft:#E1F0E7;--warn:#8F5C0E;--warn-soft:#FBEFD6;--bad:#A8372A;--bad-soft:#F7E2DE;
  --tile:#262B30;--tile-ink:#F2F4F6;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#131619;--surface:#1B1F23;--ink:#E5E8EB;--muted:#9AA3AD;--line:#2D3339;
  --hydra:#8E9EF2;--hydra-ink:#131619;--hydra-soft:#242A45;
  --ok:#72C39A;--ok-soft:#1B3027;--warn:#E2B35C;--warn-soft:#382D17;--bad:#EE8B7B;--bad-soft:#3B221F;
  --tile:#2C3238;--tile-ink:#FFFFFF;
}}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper)}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.45;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fc);font-weight:600;line-height:1.15;margin:0}
h2{font-size:1.45rem;margin:0 0 .6rem}
h3{font-size:1.15rem}

/* Cabeçalho */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;padding:10px 16px}
.plate{display:inline-flex;align-items:stretch;border:2px solid #1B1F23;border-radius:6px;background:#fff;color:#16191C;overflow:hidden;flex:none}
.plate .eu{background:#1F3FA8;color:#fff;font:600 .7rem/1 var(--fc);padding:3px 5px;display:flex;align-items:flex-end}
.plate .n{font:700 1.25rem/1.3 var(--fc);letter-spacing:.05em;padding:1px 10px}
.veh{min-width:0}
.veh b{display:block;font:600 1.15rem/1.1 var(--fc)}
.veh span{font-size:.85rem;color:var(--muted)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sync.on i{background:var(--ok)}.sync.err i{background:var(--bad)}.sync.wait i{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--hydra)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
section{margin-bottom:26px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hydra);border-color:var(--hydra);color:var(--hydra-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:transparent;background:none}
.btn.big{font-size:1.1rem;padding:12px 20px;min-height:52px}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.9rem}
:focus-visible{outline:3px solid var(--hydra);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.head h2{margin:0}

/* Início */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.lbl{margin:0 0 8px;color:var(--muted);font-size:.9rem}
.odo{display:flex;gap:5px;align-items:flex-end}
.odo span{display:block;background:var(--tile);color:var(--tile-ink);font:600 clamp(2.5rem,10vw,4.2rem)/1.08 var(--fc);min-width:.78em;text-align:center;border-radius:7px;padding:2px 4px;font-variant-numeric:tabular-nums}
.odo span:last-of-type{background:var(--hydra);color:var(--hydra-ink)}
.odo em{font:500 1.3rem var(--fc);font-style:normal;color:var(--muted);margin-left:6px}
.estado{margin:14px 0 0;max-width:62ch}
.hero-act{display:flex;flex-direction:column;gap:8px;min-width:220px}
.alerts{display:grid;gap:8px}
.al{padding:10px 14px;border-radius:9px;border-left:4px solid}
.al.warn{background:var(--warn-soft);border-color:var(--warn)}
.al.bad{background:var(--bad-soft);border-color:var(--bad)}
.al.info{background:var(--hydra-soft);border-color:var(--hydra)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:14px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:600 1.9rem/1.1 var(--fc);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hydra)}
.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}

/* Tabelas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.85rem;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:var(--hydra-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.sub{display:block;color:var(--muted);font-size:.84rem}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.b{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.8rem;font-weight:500;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok)}.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.bad{background:var(--bad-soft);color:var(--bad)}.b.mut{background:var(--paper);color:var(--muted)}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:block;height:8px;background:var(--hydra);border-radius:2px;opacity:.75}
.muted{color:var(--muted)}
.zero{color:var(--line)}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px}
.filters input{flex:1;min-width:180px}
.filters .btn{min-height:40px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:var(--surface);padding:9px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--hydra);color:var(--hydra-ink)}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.budget .card{padding:14px 16px}
.budget b{font:600 1.35rem var(--fc)}

/* Formulários */
dialog{border:0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,24,28,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 30px)}
dialog header{padding:16px 20px;border-bottom:1px solid var(--line)}
dialog .grid{padding:16px 20px;overflow-y:auto}
dialog footer{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
dialog footer .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:span 1}
.fld.w2{grid-column:span 2}.fld.full,.sec.full{grid-column:1/-1}
.fld span{font-size:.86rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
.fld textarea{resize:vertical}
.fld small{color:var(--muted);font-size:.8rem}
.grid>.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.sec{margin:8px 0 -2px;padding-top:10px;border-top:1px dashed var(--line);font-size:1.05rem}
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.set .grid{padding:0;margin:12px 0}
.set p{margin:.3rem 0 .8rem;color:var(--muted);max-width:70ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
#print{display:none}
.charts{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.chart{padding:16px 18px 14px}
.chart h3{font-size:1.1rem}.chart>p{margin:2px 0 14px;font-size:.88rem}
.ch-empty{padding:30px 0;text-align:center;color:var(--muted)}
.ch-cols{display:grid;grid-template-columns:auto 1fr;gap:8px;height:190px}
.ch-axis{display:flex;flex-direction:column;justify-content:space-between;font-size:.75rem;color:var(--muted);text-align:right;padding-bottom:22px;margin-top:-.5em;font-variant-numeric:tabular-nums}
.ch-plot{position:relative;display:flex;align-items:stretch;padding-bottom:22px}
.ch-gl{position:absolute;left:0;right:0;top:0;bottom:22px;pointer-events:none}
.ch-grid{position:absolute;left:0;right:0;height:1px;background:var(--line);transform:translateY(.5px)}
.ch-grid.base{background:var(--muted);opacity:.55}
.ch-col{position:relative;z-index:1;flex:1;display:flex;justify-content:center;align-items:flex-end;cursor:default;outline-offset:-2px}
.ch-bar{position:relative;width:min(24px,62%);background:var(--hydra);border-radius:4px 4px 0 0;min-height:0}
.ch-bar.zero{height:0!important}
.ch-col:hover .ch-bar,.ch-col:focus .ch-bar{filter:brightness(1.15)}
.ch-col:hover,.ch-col:focus{background:var(--hydra-soft)}
.ch-cap{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-3px);font-size:.75rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.ch-x{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}
.ch-rows{display:grid;gap:4px}
.ch-row{display:grid;grid-template-columns:minmax(90px,44%) 1fr;gap:10px;align-items:center;padding:3px 4px;border-radius:6px;cursor:default}
.ch-row:hover,.ch-row:focus{background:var(--hydra-soft)}
.ch-lbl{font-size:.88rem;line-height:1.25}
.ch-track{display:flex;align-items:center;gap:8px}
.ch-track i{display:block;height:16px;background:var(--hydra);border-radius:0 4px 4px 0}
.ch-track b{font-size:.85rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.85rem;padding:6px 10px;border-radius:7px;opacity:0;transition:opacity .12s;max-width:260px}
#tip.on{opacity:1}
@media (max-width:460px){.ch-x{font-size:.62rem}.ch-cap{font-size:.68rem}}
.fld[hidden]{display:none}
output.calc{display:flex;align-items:center;min-height:42px;padding:9px 10px;border-radius:8px;background:var(--hydra-soft);font-variant-numeric:tabular-nums;font-weight:500}
output.calc.big{font:600 1.5rem var(--fc);justify-content:space-between}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:10px}
.segc{padding:18px}
.segh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.segc dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 16px}
.segc dt{color:var(--muted);font-size:.84rem}.segc dd{margin:0}
.segc .mat{font:700 1.2rem var(--fc);letter-spacing:.04em}
.sigbox{position:relative;background:#fff;border:1px dashed var(--muted);border-radius:8px}
.sigbox canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sigbox .sigl{position:absolute;left:12px;right:12px;bottom:34px;border-bottom:1px solid #C9CED4;pointer-events:none}
.sigbox .sigx{position:absolute;left:14px;bottom:38px;color:#9AA3AD;font-size:.8rem;pointer-events:none}
.sigbox button{position:absolute;top:6px;right:6px;background:#fff;color:#1F2428;border-color:#D7DCE1}
.sig-img{display:block;height:40px;max-width:150px;object-fit:contain;background:#fff;border-radius:5px;padding:1px 4px}
td.sigc{width:1%;white-space:nowrap}
td.svc{min-width:240px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero-act{min-width:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .grid{grid-template-columns:1fr 1fr}
  .fld.w2{grid-column:1/-1}
  .veh span{display:none}
  .scroll table{min-width:780px}
}
@media (max-width:460px){.grid{grid-template-columns:1fr}.fld,.fld.w2{grid-column:1/-1}.sync span{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11pt/1.35 var(--f)}
  #print h1{font-size:16pt;margin-bottom:6px}
  #print table{font-size:9.5pt}
  #print th,#print td{border:1px solid #888;padding:4px 6px;color:#000}
  #print th{background:#eee}
  #print img{height:9mm;max-width:40mm;display:block}
  #print .ph{display:flex;gap:24px;margin:6px 0 12px}
  @page{size:A4 landscape;margin:12mm}
  :root{--paper:#fff;--surface:#fff;--ink:#000;--muted:#555;--line:#ccc;--hydra:#3B4FB0;--hydra-ink:#fff;--hydra-soft:#E7EAF8}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-res h1{font:600 17pt var(--fc)}
  .pr-res h3{font:600 12pt var(--fc);margin:0}
  .pr-res section{margin:0 0 5mm}
  .pr-kpi{display:flex;border:1px solid #ccc;border-radius:3mm;margin:0 0 5mm}
  .pr-kpi div{flex:1;padding:2.5mm 3mm;border-left:1px solid #ccc}.pr-kpi div:first-child{border-left:0}
  .pr-kpi b{display:block;font:600 14pt var(--fc)}.pr-kpi span{font-size:8.5pt;color:#555}
  .pr-res .charts{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .pr-res .card{border:1px solid #ccc;border-radius:3mm;break-inside:avoid;background:#fff}
  .pr-res .chart{padding:3mm 4mm}.pr-res .chart>p{margin:0 0 3mm;font-size:8.5pt}
  .pr-res .ch-cols{height:42mm}.pr-res .ch-x,.pr-res .ch-axis,.pr-res .ch-cap{font-size:7pt}
  .pr-res .ch-lbl,.pr-res .ch-track b{font-size:8pt}.pr-res .ch-track i{height:3mm}
  .pr-res .scroll{overflow:visible}.pr-res table{min-width:0!important;font-size:8.5pt}
  .pr-res section:has(table){break-inside:avoid}
  .pr-res .bar-cell i{opacity:1}
  .pr-res .zero{color:#bbb}
  .pr-foot{font-size:8.5pt;color:#555;margin-top:4mm}
  .pr-filt{font-size:9pt;margin:0 0 4mm;padding:2mm 3mm;background:#f2f2f2;border-radius:2mm}
  .pr-res .head{display:flex;justify-content:space-between;margin:0 0 2mm}.pr-res h2{font:600 13pt var(--fc);margin:0}
  .pr-res td,.pr-res th{padding:3px 5px}.pr-res td.svc{min-width:0}
  .pr-res .sig-img{height:8mm;max-width:30mm;padding:0}
  .pr-res .sub{font-size:7.5pt}
  .pr-res .b{border:1px solid #bbb}
  .pr-res .budget,.pr-res .segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-bottom:4mm}.pr-res .segs{grid-template-columns:1fr 1fr}
  .pr-res .budget .card,.pr-res .segc{padding:3mm 4mm}
  .pr-res .hero{display:flex;justify-content:space-between;border:1px solid #ccc;border-radius:3mm;padding:4mm;margin-bottom:4mm}
  .pr-res .odo span{font-size:24pt}
  .pr-res .alerts{display:grid;gap:2mm;margin-bottom:4mm}.pr-res .al{padding:2mm 3mm}
  .pr-res .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #ccc;border-radius:3mm}.pr-res .stat{padding:2.5mm 3mm}
  .pr-res .stat b{font-size:15pt}
  .pr-res .charts{margin-bottom:4mm}
  .pr-res tr{break-inside:avoid}
  .pr-res .nw{white-space:normal}
  .pr-res .card.scroll{border:0;border-radius:0}
  .pr-res table{width:100%;table-layout:auto}
  .pr-res table:has(th:nth-child(12)){font-size:7.6pt}
  .pr-res table:has(th:nth-child(12)) td,.pr-res table:has(th:nth-child(12)) th{padding:2px 3px}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="plate" aria-label="Matrícula"><span class="eu">P</span><span class="n" id="hMat"></span></div>
    <div class="veh"><b id="hVeh"></b><span>Diário de viatura</span></div>
    <div class="sync" id="hSync"><i></i><span></span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<dialog id="dlg"><form id="frm" novalidate></form></dialog>
<datalist id="dl-cond"></datalist>
<datalist id="dl-tipoman"><option>Revisão</option><option>Mudança de óleo</option><option>Reparação</option><option>Garantia</option><option>Lavagem</option><option>Outro</option></datalist>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>
<div id="print"></div>

 const id='f_'+f.k,req=f.req?' required':'',v=val??'';let inp;
 if(f.t==='select'){const opts=typeof f.opts==='function'?f.opts():f.opts;const list=[...opts];if(v!==''&&!list.includes(v))list.unshift(v);
  inp=`<select id="${id}" name="${f.k}"${req}><option value=""${v===''?' selected':''}>—</option>${list.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`}
 else if(f.t==='textarea')inp=`<textarea id="${id}" name="${f.k}" rows="${f.rows||2}"${req}>${esc(v)}</textarea>`;
 else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}"${req}${f.t==='number'?` step="${f.step||'any'}" min="0" inputmode="${f.step===1?'numeric':'decimal'}"`:''}${f.list?` list="${f.list}"`:''} autocomplete="off">`;

}

 }

function iniciarPads(frm){
 frm.querySelectorAll('canvas[data-sig]').forEach(cv=>{
  const k=cv.dataset.sig,inp=frm.elements[k],dpr=Math.min(2,window.devicePixelRatio||1),box=cv.parentNode;
  cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  const ctx=cv.getContext('2d');ctx.lineWidth=2.4*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1B2F7A';
  const hint=box.querySelector('.sigx');let desenho=false,last=null;
  const vazio=()=>{hint.style.display=inp.value?'none':''};
  if(inp.value){const im=new Image();im.onload=()=>{const s=Math.min(cv.width/im.width,cv.height/im.height);ctx.drawImage(im,(cv.width-im.width*s)/2,(cv.height-im.height*s)/2,im.width*s,im.height*s)};im.src=inp.value}
  vazio();
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  cv.onpointerdown=e=>{desenho=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();hint.style.display='none'};
  cv.onpointermove=e=>{if(!desenho)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{if(!desenho)return;desenho=false;inp.value=exportarAssinatura(cv)};
  box.querySelector('[data-sigclear]').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);inp.value='';vazio()};
 });
}
function exportarAssinatura(cv){
 const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=-1,y1=-1;
 for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2)if(d[(y*cv.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return '';
 const m=10;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(cv.width,x1+m);y1=Math.min(cv.height,y1+m);
 const w=x1-x0,h=y1-y0,s=Math.min(1,360/w,140/h),o=document.createElement('canvas');o.width=Math.round(w*s);o.height=Math.round(h*s);
 o.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,o.width,o.height);return o.toDataURL('image/png');
}

/* ---------- Tabelas ---------- */
function tabela(tipo,rows,cols,foot){
 if(!rows.length)return `<div class="card empty">${(S[tipo]||[]).length?'Nenhum registo corresponde à pesquisa ou aos filtros escolhidos.':'Ainda não há registos. Use o botão acima para adicionar o primeiro.'}</div>`;
 return `<div class="card scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.c||''}">${c.l}</th>`).join('')}</tr></thead>
 <tbody>${rows.map(r=>`<tr data-id="${r.id}" data-tipo="${tipo}" tabindex="0">${cols.map(c=>`<td class="${c.c||''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody>
 ${foot?`<tfoot><tr>${foot.map(f=>`<td class="${f.c||''}"${f.span?` colspan="${f.span}"`:''}>${f.v}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
}
const estadoB=v=>!v?'<span class="b mut">—</span>':v==='OK'?'<span class="b ok">OK</span>':v==='Não tem'?'<span class="b mut">Não tem</span>':`<span class="b bad">${esc(v)}</span>`;

/* ---------- Cálculos ---------- */
function galp(ano){const c=S.config,prev=Number((c.orcamento||{})[ano])||0;
 const gasto=sum(S.abastecimentos.filter(a=>a.pagamento===c.pagamentoOrcamento&&(a.data||'').startsWith(ano)),a=>a.valor);
 return{prev,gasto,rest:prev-gasto,pct:prev?gasto/prev:0}}
function abastCalc(){const l=[...S.abastecimentos].sort((a,b)=>kD(a).localeCompare(kD(b)));
 return l.map((a,i)=>{const p=l[i-1];const km=p&&a.km!=null&&p.km!=null?a.km-p.km:null;
  return{...a,difDias:p?dias(p.data,a.data):null,kmDesde:km,consumo:km>0&&a.litros?a.litros/km*100:null}})}
function alertas(){
 const c=S.config,al=[],h=hoje(),ab=viagemAberta();
 const ins=[...S.inspecoes].sort((a,b)=>kD(b).localeCompare(kD(a)))[0];
 if(!ins)al.push({n:'warn',t:'Ainda não há inspeções mensais registadas.'});
 else{const d=dias(ins.data,h);if(d>c.inspecaoDias)al.push({n:'warn',t:`Inspeção mensal em atraso — a última foi a ${fmtD(ins.data)}, há ${d} dias. <button class="btn sm" data-act="novo" data-tipo="inspecoes">Registar inspeção</button>`});
  const nc=['pneus','luzes','travoes','oleo','liquidos'].filter(k=>ins[k]==='Não conforme');
  if(nc.length)al.push({n:'bad',t:`A última inspeção (${fmtD(ins.data)}) tem pontos não conformes: ${nc.map(k=>SC.inspecoes.campos.find(f=>f.k===k).l.toLowerCase()).join(', ')}.`})}
 S.condutores.forEach(k=>{if(!k.validade)return;const d=dias(h,k.validade);
  if(d<0)al.push({n:'bad',t:`A carta de condução de ${esc(k.nome)} expirou a ${fmtD(k.validade)}.`});
  else if(d<=c.cartaAvisoDias)al.push({n:'warn',t:`A carta de condução de ${esc(k.nome)} expira a ${fmtD(k.validade)} (daqui a ${d} dias).`})});
 const y=h.slice(0,4),g=galp(y);
 if(g.prev&&g.rest<0)al.push({n:'bad',t:`Orçamento ${esc(c.pagamentoOrcamento)} de ${y} ultrapassado em ${eur(-g.rest)}.`});
 else if(g.prev&&g.pct>=.85)al.push({n:'warn',t:`Restam ${eur(g.rest)} do orçamento ${esc(c.pagamentoOrcamento)} de ${y}.`});
 Object.keys(OBJ_SEG).forEach(o=>{const s=segAtual(o),e=estadoSeg(s),nm=o==='viatura'?'da viatura':'do atrelado do barco';
  const bt=s?` <button class="btn sm" data-act="renovar-seg" data-id="${s.id}">Registar renovação</button>`:'';
  if(e.c==='bad')al.push({n:'bad',t:`O seguro ${nm} (${esc(fmtMat(s.matricula))}, apólice ${esc(s.apolice)}) expirou a ${fmtD(s.fim)}.${bt}`});
  else if(e.c==='warn')al.push({n:'warn',t:`O seguro ${nm} (${esc(fmtMat(s.matricula))}, apólice ${esc(s.apolice)}) termina a ${fmtD(s.fim)} — daqui a ${e.d} ${e.d===1?'dia':'dias'}.${bt}`});
  else if(!s)al.push({n:'info',t:`Ainda não há seguro registado ${nm}. <button class="btn sm" data-act="tab" data-tab="seguros">Abrir Seguros</button>`})});
 if(ab&&dias(ab.dataSaida,h)>=1)al.push({n:'info',t:`A saída de ${fmtD(ab.dataSaida)} ainda não tem entrada registada.`});
 return al;
}

/* ---------- Vistas ---------- */
const TABS=[['inicio','Início'],['diario','Diário'],['abastecimentos','Abastecimentos'],['inspecoes','Inspeções'],['manutencao','Manutenção'],['acidentes','Acidentes'],['seguros','Seguros'],['condutores','Condutores'],['resumo','Resumo anual'],['definicoes','Definições']];
let tab=location.hash.slice(1)||'inicio';if(!TABS.some(t=>t[0]===tab))tab='inicio';
const F={ano:String(new Date().getFullYear()),mes:'',condutor:'',categoria:'',q:''};
let subMan='manutencoes',anoRes=String(new Date().getFullYear());
const V={};

V.inicio=()=>{
 const km=kmAtual(),ab=viagemAberta(),y=hoje().slice(0,4),al=alertas();
 const vy=S.viagens.filter(v=>(v.dataSaida||'').startsWith(y)),ay=S.abastecimentos.filter(a=>(a.data||'').startsWith(y)),g=galp(y);
 const ult=[...S.viagens].filter(v=>!aberta(v)).sort((a,b)=>kV(b).localeCompare(kV(a)))[0];
 const dig=String(km).padStart(6,'0').split('');
 const rec=[...S.viagens].sort((a,b)=>kV(b).localeCompare(kV(a))).slice(0,6);
 return `<section class="hero">
  <div><p class="lbl">Conta-quilómetros</p><div class="odo" aria-label="${km} quilómetros">${dig.map(d=>`<span>${d}</span>`).join('')}<em>km</em></div>
  <p class="estado">${ab?`<span class="b warn">Em serviço</span> ${esc(ab.condutor)} saiu a ${fmtD(ab.dataSaida)} às ${ab.horaSaida} com ${fmtN(ab.kmSaida)} km — ${esc(ab.servico)}`
   :`<span class="b ok">Disponível</span> ${ult?`Última entrada a ${fmtD(ult.dataEntrada)} às ${ult.horaEntrada}, por ${esc(ult.condutor)}.`:'Sem saídas registadas.'}`}</p></div>
  <div class="hero-act">${ab?`<button class="btn primary big" data-act="entrada" data-id="${ab.id}">Registar entrada</button>`:`<button class="btn primary big" data-act="novo" data-tipo="viagens">Registar saída</button>`}
   <button class="btn" data-act="novo" data-tipo="abastecimentos">Registar abastecimento</button>
   <button class="btn" data-act="novo" data-tipo="inspecoes">Registar inspeção mensal</button></div></section>
 ${al.length?`<section class="alerts">${al.map(a=>`<div class="al ${a.n}">${a.t}</div>`).join('')}</section>`:''}
 <section><div class="head"><h2>Em ${y}</h2>${btnPrint}</div><div class="stats">
  <div class="stat"><b>${vy.length}</b><span>saídas</span></div>
  <div class="stat"><b>${fmtN(sum(vy,kmFeitos))}</b><span>km percorridos</span></div>
  <div class="stat"><b>${fmtN(sum(ay,a=>a.litros),1)} L</b><span>combustível, ${eur(sum(ay,a=>a.valor))}</span></div>
  <div class="stat"><b>${g.prev?eur(g.rest):'—'}</b><span>${g.prev?`restante do orçamento ${esc(S.config.pagamentoOrcamento)} (${eur(g.prev)})`:'orçamento de combustível não definido'}</span>
   ${g.prev?`<div class="meter"><i class="${g.pct>=1?'bad':g.pct>=.85?'warn':''}" style="width:${Math.min(100,g.pct*100)}%"></i></div>`:''}</div>
 </div></section>
 <section><div class="head"><h2>Últimas saídas</h2><button class="btn sm" data-act="tab" data-tab="diario">Ver diário completo</button></div>
 ${tabela('viagens',rec,colsViagens(true))}</section>`;
};

function colsViagens(curto){
 const c=[{l:'Data',c:'nw',v:v=>fmtD(v.dataSaida)+(v.dataEntrada&&v.dataEntrada!==v.dataSaida?`<span class="sub">até ${fmtD(v.dataEntrada)}</span>`:'')},
  {l:'Saída',c:'nw',v:v=>v.horaSaida},{l:'Entrada',c:'nw',v:v=>aberta(v)?'<span class="b warn">Em serviço</span>':v.horaEntrada},
  {l:'Tempo',c:'num',v:v=>fmtDur(minutos(v))}];
 if(!curto)c.push({l:'Km saída',c:'num',v:v=>fmtN(v.kmSaida)},{l:'Km entrada',c:'num',v:v=>fmtN(v.kmEntrada)});
 c.push({l:'Km feitos',c:'num',v:v=>`<b>${fmtN(kmFeitos(v))}</b>`},
  {l:'Serviço efetuado',c:'svc',v:v=>`${esc(v.servico)}<span class="sub">${esc(v.categoria)}${v.obs?' — '+esc(v.obs.slice(0,80))+(v.obs.length>80?'…':''):''}</span>`},
  {l:'Condutor',c:'nw',v:v=>esc(v.condutor)},{l:'Rubrica',c:'sigc',v:v=>sigCel('viagens',v)});
 return c;
}
function filtrarViagens(){const q=F.q.toLowerCase();return S.viagens.filter(v=>(!q||txtMatch(v,q))&&(!F.ano||(v.dataSaida||'').startsWith(F.ano))&&(!F.mes||(v.dataSaida||'').slice(5,7)===F.mes)&&(!F.condutor||v.condutor===F.condutor)&&(!F.categoria||v.categoria===F.categoria))}
V.diario=()=>{
 const rows=filtrarViagens().sort((a,b)=>kV(b).localeCompare(kV(a))),ab=viagemAberta();
 const LB={ano:'Ano',mes:'Mês',condutor:'Condutor',categoria:'Categoria'};
 const sel=(k,opts,todos)=>`<select data-filter="${k}" data-lbl="${LB[k]}" aria-label="${LB[k]}"><option value="">${todos}</option>${opts.map(o=>`<option value="${esc(o[0])}"${F[k]===o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 return `<div class="head"><h2>Registo diário</h2><div class="row">
  <button class="btn" data-act="print-diario">Imprimir / PDF</button>
  ${ab?`<button class="btn primary" data-act="entrada" data-id="${ab.id}">Registar entrada</button>`:`<button class="btn primary" data-act="novo" data-tipo="viagens">Registar saída</button>`}</div></div>
 <div class="filters">${sel('ano',anos().map(a=>[a,a]),'Todos os anos')}${sel('mes',MESES.map((m,i)=>[pad(i+1),m]),'Todos os meses')}
  ${sel('condutor',nomesCond().map(n=>[n,n]),'Todos os condutores')}${sel('categoria',S.config.categorias.map(n=>[n,n]),'Todas as categorias')}
  <input type="search" data-filter="q" placeholder="Pesquisar serviço, observações…" value="${esc(F.q)}" aria-label="Pesquisar">
  ${Object.values(F).some(Boolean)?'<button class="btn" data-act="limpar-f" data-key="viagens">Limpar filtros</button>':''}</div>
 ${tabela('viagens',rows,colsViagens(false),[{v:`${rows.length} ${rows.length===1?'saída':'saídas'}`,span:3},{v:fmtDur(sum(rows,minutos)),c:'num'},{v:'',span:2},{v:fmtN(sum(rows,kmFeitos))+' km',c:'num'},{v:'',span:3}])}`;
};

/* ---------- Filtros e pesquisa ---------- */
const Y0=String(new Date().getFullYear());
const FT={abastecimentos:{ano:Y0,mes:'',pagamento:'',condutor:'',q:''},inspecoes:{ano:'',mes:'',estado:'',q:''},
 manutencoes:{ano:'',mes:'',tipo:'',q:''},pneus:{ano:'',mes:'',q:''},regeneracoes:{ano:'',mes:'',resultado:'',q:''},
 acidentes:{ano:'',mes:'',condutor:'',participacao:'',q:''},seguros:{objeto:'',estado:'',q:''},condutores:{estado:'',reboque:'',q:''}};
const txtMatch=(r,q)=>{if(!q)return true;q=q.toLowerCase();return Object.entries(r).some(([k,x])=>{if(k==='rubrica'||k==='id'||x==null||typeof x==='object')return false;const s=String(x).toLowerCase();return s.includes(q)||(/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmtD(s).includes(q))})};
const dataMatch=(d,f)=>(!f.ano||(d||'').startsWith(f.ano))&&(!f.mes||(d||'').slice(5,7)===f.mes);
const unicos=arr=>[...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt')).map(x=>[x,x]);
function barraFiltros(key,extra=[],ph='Pesquisar'){
 const f=FT[key];
 const sel=(k,lbl,opts,todos)=>`<select data-ff="${key}.${k}" data-lbl="${lbl}" aria-label="${lbl}"><option value="">${todos}</option>${opts.map(o=>`<option value="${esc(o[0])}"${f[k]===String(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 let h='';
 if('ano' in f)h+=sel('ano','Ano',anos().map(a=>[a,a]),'Todos os anos');
 if('mes' in f)h+=sel('mes','Mês',MESES.map((m,i)=>[pad(i+1),m]),'Todos os meses');
 extra.forEach(e=>h+=sel(e.k,e.lbl,e.opts,e.todos));
 return `<div class="filters">${h}<input type="search" data-ffq="${key}" placeholder="${esc(ph)}" value="${esc(f.q)}" aria-label="Pesquisar">
  ${Object.values(f).some(Boolean)?`<button class="btn" data-act="limpar-f" data-key="${key}">Limpar filtros</button>`:''}</div>`;
}
const btnPrint='<button class="btn" data-act="print-vista">Imprimir / PDF</button>';

V.abastecimentos=()=>{
 const c=S.config,f=FT.abastecimentos,ys=Object.keys(c.orcamento||{}).sort();
 const l=abastCalc().reverse().filter(a=>dataMatch(a.data,f)&&(!f.pagamento||a.pagamento===f.pagamento)&&(!f.condutor||a.condutor===f.condutor)&&txtMatch(a,f.q));
 const asc=[...l].reverse();
 const per=f.ano?MESES.map((n,i)=>{const x=l.filter(a=>a.data.startsWith(`${f.ano}-${pad(i+1)}`));return{l:MES3[i],tip:`${n} ${f.ano}`,lt:r2(sum(x,a=>a.litros)),e:r2(sum(x,a=>a.valor))}})
  :[...new Set(l.map(a=>a.data.slice(0,4)))].sort().map(y=>{const x=l.filter(a=>a.data.startsWith(y));return{l:y,tip:y,lt:r2(sum(x,a=>a.litros)),e:r2(sum(x,a=>a.valor))}});
 const pp=f.ano?'por mês':'por ano';
 const cs=asc.filter(a=>a.consumo),cMed=sum(cs,a=>a.kmDesde)?sum(cs,a=>a.litros)/sum(cs,a=>a.kmDesde)*100:0;
 const pags=[...new Set(l.map(a=>a.pagamento||'Sem indicação'))].map(p=>{const x=l.filter(a=>(a.pagamento||'Sem indicação')===p);return{l:p,v:r2(sum(x,a=>a.valor)),extra:fmtN(sum(x,a=>a.litros),1)+' L, '+x.length+(x.length===1?' abastecimento':' abastecimentos')}}).sort((a,b)=>b.v-a.v);
 return `<div class="head"><h2>Abastecimentos</h2><div class="row">${btnPrint}<button class="btn primary" data-act="novo" data-tipo="abastecimentos">Registar abastecimento</button></div></div>
 ${ys.length?`<div class="budget">${ys.map(y=>{const g=galp(y);return `<div class="card"><span class="muted">Previsão autorizada ${esc(c.pagamentoOrcamento)} ${y}</span><br>
  <b>${eur(g.rest)}</b> <span class="muted">restantes de ${eur(g.prev)}</span>
  <div class="meter"><i class="${g.pct>=1?'bad':g.pct>=.85?'warn':''}" style="width:${Math.min(100,g.pct*100)}%"></i></div></div>`}).join('')}</div>`:''}
 ${barraFiltros('abastecimentos',[{k:'pagamento',lbl:'Pagamento',todos:'Todos os pagamentos',opts:unicos([...c.pagamentos,...S.abastecimentos.map(a=>a.pagamento)])},
   {k:'condutor',lbl:'Condutor',todos:'Todos os condutores',opts:unicos(S.abastecimentos.map(a=>a.condutor))}],'Pesquisar fatura, observações…')}
 <section class="charts">
  <div class="card chart"><h3>Litros abastecidos ${pp}</h3><p class="muted">Total: ${fmtN(sum(l,a=>a.litros),2)} L</p>${colunas(per.map(x=>({l:x.l,tip:x.tip,v:x.lt})),v=>fmtN(v,1)+' L',eixoNum)}</div>
  <div class="card chart"><h3>Valor pago ${pp}</h3><p class="muted">Total: ${eur(sum(l,a=>a.valor))}</p>${colunas(per.map(x=>({l:x.l,tip:x.tip,v:x.e})),v=>eur(v),v=>fmtN(v,0)+' €')}</div>
  <div class="card chart"><h3>Consumo estimado por abastecimento</h3><p class="muted">${cs.length?`Média: ${fmtN(cMed,1)} L/100 km`:'Precisa de pelo menos dois abastecimentos'}</p>${colunas(cs.map(a=>({l:fmtD(a.data).slice(0,5),tip:fmtD(a.data),v:Math.round(a.consumo*10)/10})),v=>fmtN(v,1)+' L/100 km',v=>fmtN(v,0))}</div>
  <div class="card chart"><h3>Valor pago por forma de pagamento</h3><p class="muted">${l.length} ${l.length===1?'abastecimento':'abastecimentos'}</p>${barras(pags,v=>eur(v))}</div>
 </section>
 ${tabela('abastecimentos',l,[
  {l:'Data',c:'nw',v:a=>fmtD(a.data)},{l:'Km',c:'num',v:a=>fmtN(a.km)},{l:'Litros',c:'num',v:a=>fmtN(a.litros,2)},
  {l:'Preço c/desc. s/IVA',c:'num',v:a=>{const c=calcIVA(a);return c&&!c.legado?`${fmtN(c.pcd,4)} €<span class="sub">${fmtN(a.precoSemIva,4)} − ${fmtN(a.descUnit||0,4)} desc.</span>`:'—'}},
  {l:'Total s/IVA',c:'num',v:a=>{const c=calcIVA(a);return c&&!c.legado?eur(c.base):'—'}},
  {l:'Total IVA',c:'num',v:a=>{const c=calcIVA(a);return c&&!c.legado?`${eur(c.iva)}<span class="sub">${fmtN(c.taxa,c.taxa%1?1:0)}%</span>`:'—'}},
  {l:'Total pago (c/IVA)',c:'num',v:a=>`<b>${eur(a.valor)}</b>`},
  {l:'Desde o anterior',c:'num',v:a=>a.kmDesde!=null?`${fmtN(a.kmDesde)} km<span class="sub">${a.difDias} dias</span>`:'—'},
  {l:'Consumo estimado',c:'num',v:a=>a.consumo?fmtN(a.consumo,1)+' L/100':'—'},
  {l:'Fatura',c:'nw',v:a=>esc(a.fatura)},{l:'Pagamento',c:'nw',v:a=>esc(a.pagamento)},{l:'Condutor',c:'nw',v:a=>esc(a.condutor)},{l:'Rubrica',c:'sigc',v:a=>sigCel('abastecimentos',a)}],
  [{v:`${l.length} ${l.length===1?'abastecimento':'abastecimentos'}`,span:2},{v:fmtN(sum(l,a=>a.litros),2),c:'num'},{v:''},{v:eur(sum(l,a=>{const c=calcIVA(a);return c&&!c.legado?c.base:0})),c:'num'},{v:eur(sum(l,a=>{const c=calcIVA(a);return c&&!c.legado?c.iva:0})),c:'num'},{v:eur(sum(l,a=>a.valor)),c:'num'},{v:'',span:7}])}
 <p class="muted" style="font-size:.88rem">O consumo estimado divide os litros de cada abastecimento pelos km feitos desde o anterior — é fiável quando se atesta sempre o depósito.</p>`;
};

const INSP_K=['pneus','luzes','travoes','oleo','liquidos','extintor'];
const temNC=r=>INSP_K.some(k=>r[k]==='Não conforme');
V.inspecoes=()=>{
 const f=FT.inspecoes;
 const l=[...S.inspecoes].sort((a,b)=>kD(b).localeCompare(kD(a))).filter(r=>dataMatch(r.data,f)&&(!f.estado||(f.estado==='nc'?temNC(r):f.estado==='ok'?!temNC(r):!r.rubrica))&&txtMatch(r,f.q));
 return `<div class="head"><h2>Inspeções mensais</h2><div class="row">${btnPrint}<button class="btn primary" data-act="novo" data-tipo="inspecoes">Registar inspeção</button></div></div>
 ${barraFiltros('inspecoes',[{k:'estado',lbl:'Estado',todos:'Todos os estados',opts:[['nc','Com pontos não conformes'],['ok','Tudo conforme'],['nass','Por assinar']]}],'Pesquisar observações, seguimento…')}
 ${tabela('inspecoes',l,[{l:'Data',c:'nw',v:r=>fmtD(r.data)},
  ...INSP_K.map(k=>({l:SC.inspecoes.campos.find(f=>f.k===k).l,v:r=>estadoB(r[k])})),
  {l:'Diversos e observações',v:r=>[r.diversos,r.observacoes].filter(Boolean).map(esc).join('<br>')+(r.seguimento?`<span class="sub">Seguimento: ${nl(r.seguimento)}</span>`:'')},
  {l:'Verificado por',c:'nw',v:r=>esc(r.assinatura)||'—'},{l:'Assinatura',c:'sigc',v:r=>sigCel('inspecoes',r)}],
  l.length?[{v:`${l.length} ${l.length===1?'inspeção':'inspeções'}`,span:10}]:null)}`;
};

V.manutencao=()=>{
 const segs=[['manutencoes','Manutenção e reparações'],['pneus','Pneus'],['regeneracoes','Regenerações DPF']];
 const f=FT[subMan];let body='',fil='';
 if(subMan==='manutencoes'){
  const l=[...S.manutencoes].sort((a,b)=>kD(b).localeCompare(kD(a))).filter(r=>dataMatch(r.data,f)&&(!f.tipo||r.tipo===f.tipo)&&txtMatch(r,f.q));
  fil=barraFiltros('manutencoes',[{k:'tipo',lbl:'Tipo',todos:'Todos os tipos',opts:unicos(S.manutencoes.map(r=>r.tipo))}],'Pesquisar descrição, fornecedor…');
  body=tabela('manutencoes',l,[{l:'Data',c:'nw',v:r=>fmtD(r.data)},{l:'Tipo',v:r=>esc(r.tipo)},{l:'Descrição',v:r=>esc(r.descricao)+(r.obs?`<span class="sub">${esc(r.obs)}</span>`:'')},
   {l:'Fornecedor',v:r=>esc(r.fornecedor)},{l:'Km',c:'num',v:r=>fmtN(r.km)},{l:'Custo',c:'num',v:r=>eur(r.custo)}],
   [{v:`${l.length} ${l.length===1?'registo':'registos'}`,span:5},{v:eur(sum(l,r=>r.custo)),c:'num'}])}

/* ---------- Gráficos ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function colunas(dados,fmt,fmtEixo){
 const mx=Math.max(0,...dados.map(d=>d.v)),top=niceMax(mx),ticks=[0,top/2,top];
 if(!mx)return '<div class="ch-empty">Sem dados para mostrar.</div>';
 const iMax=dados.findIndex(d=>d.v===mx);
 return `<div class="ch-cols" role="img" aria-label="${esc(dados.map(d=>d.l+': '+fmt(d.v)).join('; '))}">
  <div class="ch-axis">${ticks.slice().reverse().map(v=>`<span>${fmtEixo(v)}</span>`).join('')}</div>
  <div class="ch-plot"><div class="ch-gl">${ticks.map((v,i)=>`<i class="ch-grid${i?'':' base'}" style="bottom:${v/top*100}%"></i>`).join('')}</div>
   ${dados.map((d,i)=>`<div class="ch-col" data-tip="${esc(d.tip||d.l)}: ${esc(fmt(d.v))}" tabindex="0">
    <div class="ch-bar${d.v?'':' zero'}" style="height:${d.v/top*100}%">${i===iMax?`<b class="ch-cap">${esc(fmt(d.v))}</b>`:''}</div>
    <span class="ch-x">${i%Math.ceil(dados.length/12)===0?esc(d.l):''}</span></div>`).join('')}</div></div>`;
}
function barras(dados,fmt){
 const mx=Math.max(0,...dados.map(d=>d.v));if(!mx)return '<div class="ch-empty">Sem dados para mostrar.</div>';
 return `<div class="ch-rows">${dados.map(d=>`<div class="ch-row" data-tip="${esc(d.l)}: ${esc(fmt(d.v))}${d.extra?' — '+esc(d.extra):''}" tabindex="0">
  <span class="ch-lbl">${esc(d.l)}</span><span class="ch-track"><i style="width:${Math.max(1.5,d.v/mx*100)}%"></i><b>${esc(fmt(d.v))}</b></span></div>`).join('')}</div>`;
}
const eixoNum=v=>v>=1000?fmtN(v/1000,v%1000?1:0)+' mil':fmtN(v,v%1?1:0);

  <div class="pr-kpi"><div><b>${vs.length}</b><span>saídas</span></div><div><b>${fmtN(sum(vs,kmFeitos))} km</b><span>percorridos</span></div>
   <div><b>${fmtDur(sum(vs,minutos))}</b><span>em serviço</span></div><div><b>${fmtN(sum(as,a=>a.litros),1)} L</b><span>combustível</span></div><div><b>${eur(sum(as,a=>a.valor))}</b><span>pago em combustível</span></div></div>
  ${box.innerHTML}
  <p class="pr-foot">Impresso a ${fmtD(hoje())}</p></div>`;
 paginaImpressao('A4 portrait');
 const titulo=document.title;document.title=`Resumo_anual_${y}_${(v.matricula||'').replace(/\W/g,'')}`;
 const fim=()=>{document.title=titulo;window.removeEventListener('afterprint',fim)};window.addEventListener('afterprint',fim);
 setTimeout(()=>window.print(),50);
}
function imprimirDiario(){paginaImpressao('A4 landscape');
 const rows=filtrarViagens().sort((a,b)=>kV(a).localeCompare(kV(b))),v=S.config.viatura;
 const per=[F.mes?MESES[+F.mes-1]:'',F.ano||'Todos os anos'].filter(Boolean).join(' de ')+(F.condutor?`, ${F.condutor}`:'')+(F.categoria?`, ${F.categoria}`:'');
 $('#print').innerHTML=`<h1>Registo diário de viatura</h1><div class="ph"><span>Marca: <b>${esc(v.marca)}</b></span><span>Modelo: <b>${esc(v.modelo)}</b></span><span>Matrícula: <b>${esc(fmtMat(v.matricula))}</b></span><span>Período: <b>${esc(per)}</b></span></div>
 <table><thead><tr><th>Data</th><th>Hora saída</th><th>Hora entrada</th><th>Km saída</th><th>Km entrada</th><th>Km feitos</th><th>Serviço efetuado</th><th>Condutor</th><th style="width:42mm">Rubrica</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td>${fmtD(r.dataSaida)}${r.dataEntrada!==r.dataSaida&&r.dataEntrada?' a '+fmtD(r.dataEntrada):''}</td><td>${r.horaSaida}</td><td>${r.horaEntrada||''}</td><td>${fmtN(r.kmSaida)}</td><td>${fmtN(r.kmEntrada)}</td><td>${fmtN(kmFeitos(r))}</td><td>${esc(r.servico)}</td><td>${esc(r.condutor)}</td><td>${r.rubrica?`<img src="${r.rubrica}" alt="">`:''}</td></tr>`).join('')}
 <tr><td colspan="5"><b>Total: ${rows.length} saídas</b></td><td><b>${fmtN(sum(rows,kmFeitos))}</b></td><td colspan="3"></td></tr></tbody></table>
 <p style="margin-top:14px;font-size:9pt">Impresso a ${fmtD(hoje())}</p>`;
 window.print();
}

/* ---------- Exportar / importar ---------- */
function descarregar(nome,conteudo,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const nomeBase=()=>`Diario_Viatura_${(S.config.viatura.matricula||'').replace(/\W/g,'')}_${hoje()}`;
function exportXlsx(){
 if(!window.XLSX){toast('O Excel precisa de ligação à internet. Use a cópia JSON.');return}
 const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{'Sem registos':''}]),n);
 const asc=(t,k)=>[...S[t]].sort((a,b)=>k(a).localeCompare(k(b)));
 add('Reg. Diário',asc('viagens',kV).map(v=>({'Data saída':fmtD(v.dataSaida),'Hora saída':v.horaSaida,'Km saída':v.kmSaida,'Data entrada':fmtD(v.dataEntrada),'Hora entrada':v.horaEntrada,'Km entrada':v.kmEntrada,'Km feitos':kmFeitos(v),'Tempo':fmtDur(minutos(v)),'Categoria':v.categoria,'Serviço efetuado':v.servico,'Condutor':v.condutor,'Rubricado':v.rubrica?'Sim':'Não','Observações':v.obs})));
 add('Abastecimentos',abastCalc().map(a=>({'Data':fmtD(a.data),'Km':a.km,'Litros':a.litros,'Preço L s/IVA':a.precoSemIva,'Desc. unitário s/IVA':a.descUnit,'Preço c/desc. s/IVA':a.precoComDesc,'Taxa IVA (%)':a.taxaIva,'Total s/IVA':a.baseSemIva,'Total IVA':a.iva,'Total com IVA':a.valor,'N.º Fatura':a.fatura,'Condutor':a.condutor,'Rubricado':a.rubrica?'Sim':'Não','Pagamento':a.pagamento,'Dif. tempo (dias)':a.difDias,'Km feitos':a.kmDesde,'Consumo L/100':a.consumo?+a.consumo.toFixed(1):null,'Observações':a.obs})));
 add('Pneus',asc('pneus',kD).map(r=>({'Data':fmtD(r.data),'Km':r.km,'Oficina':r.oficina,'Observações':r.observacoes,'Nome':r.condutor,'Rubricado':r.rubrica?'Sim':'Não'})));
 add('Inspeções Mensais',asc('inspecoes',kD).map(r=>({'Data':fmtD(r.data),'Pneus':r.pneus,'Luzes':r.luzes,'Travões':r.travoes,'Óleo':r.oleo,'Líquidos':r.liquidos,'Extintor':r.extintor,'Diversos':r.diversos,'Observações':r.observacoes,'Verificado por':r.assinatura,'Assinado':r.rubrica?'Sim':'Não','Seguimento':r.seguimento})));
 add('Manutenção e Reparações',asc('manutencoes',kD).map(r=>({'Data':fmtD(r.data),'Tipo de Operação':r.tipo,'Descrição':r.descricao,'Fornecedor':r.fornecedor,'Custo':r.custo,'Km':r.km,'Observações':r.obs})));
 add('Regenerações',asc('regeneracoes',kD).map(r=>({'Data':fmtD(r.data),'Km':r.km,'Tipo de Regeneração':r.tipo,'Duração (min)':r.duracao,'Resultado':r.resultado,'Observações':r.obs})));
 add('Lista Condutores',S.condutores.map(r=>({'Nome':r.nome,'Carta Condução':r.carta,'Validade':fmtD(r.validade),'Despacho':r.despacho,'Reboque':r.reboque})));
 add('Seguros',[...S.seguros].sort((a,b)=>(a.inicio||'').localeCompare(b.inicio||'')).map(r=>({'Seguro de':OBJ_SEG[r.objeto]||r.objeto,'Matrícula':fmtMat(r.matricula),'N.º Apólice':r.apolice,'Seguradora':r.seguradora,'Início':fmtD(r.inicio),'Fim':fmtD(r.fim),'Prémio':r.premio,'Observações':r.obs})));
 add('Registo Acidentes',asc('acidentes',kD).map(r=>({'Data':fmtD(r.data),'Hora':r.hora,'Local':r.local,'Condutor':r.condutor,'Descrição do Acidente':r.descricao,'Danos':r.danos,'Entidades Envolvidas':r.entidades,'Participação':r.participacao})));
 XLSX.writeFile(wb,nomeBase()+'.xlsx');
}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const x=JSON.parse(await f.text());if(!x.config||!Array.isArray(x.viagens))throw 0;
  const n=x.viagens.length;if(!confirm(`Substituir todos os registos atuais pelos da cópia (${n} saídas)?`))return;
  S=norm(x);saveLocal();if(fb.on)await fbSubstituir(S);render();toast('Cópia importada')}
 catch(err){alert('O ficheiro não é uma cópia válida do Diário de Viatura.')}};

/* ---------- Firebase ---------- */
const fb={on:false,col:null,codigo:'',unsub:null,estado:'local',primeira:true};
const limpo=o=>JSON.parse(JSON.stringify(o));
function setSync(e,msg){fb.estado=e;const el=$('#hSync');el.className='sync '+({on:'on',err:'err',wait:'wait'}[e]||'');
 el.querySelector('span').textContent=msg||({local:'Só neste equipamento',wait:'A ligar…',on:'Sincronizado',err:'Erro de sincronização'}[e])}
function carregarScript(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function fbIniciar(){
 const cfg=fbGuardado();if(!cfg)return setSync('local');
 setSync('wait');
 try{
  await carregarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await carregarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg.config);
  const db=firebase.firestore(app);
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  fb.col=db.collection('diario_viatura');fb.codigo=cfg.codigo;fb.on=true;fb.primeira=true;
  if(fb.unsub)fb.unsub();
  const q=fb.col.where('_codigo','==',fb.codigo);
  fb.unsub=q.onSnapshot({includeMetadataChanges:true},snap=>{
   const cache=snap.metadata.fromCache;
   if(fb.primeira){
    if(cache){if(snap.empty){setSync('wait','A ligar ao servidor…');return}}
    else{fb.primeira=false;
     const nReg=snap.docs.filter(d=>d.get('_tipo')!=='config').length,nLoc=TIPOS.reduce((s,t)=>s+S[t].length,0);
     if(nReg===0){setSync('on');
      if(nLoc&&confirm(`A base partilhada ainda não tem registos. Enviar os ${nLoc} registos deste equipamento?`))fbSubstituir(S);
      else if(snap.empty)fbCfg();
      render();return}}
   }
   if(!snap.metadata.hasPendingWrites||!cache){
    const n=vazio();n.config=S.config;
    snap.forEach(d=>{const x=d.data(),t=x._tipo;delete x._tipo;delete x._codigo;if(t==='config')n.config={...defaultConfig(),...x};else if(n[t])n[t].push(x)});
    if(TIPOS.some(t=>n[t].length)||fb.vazioOk){S=norm(n);saveLocal();if(!$('#dlg').open)render()}
   }
   if(cache)setSync('wait',navigator.onLine===false?'Sem internet — a guardar localmente':'A ligar ao servidor…');
   else setSync('on');
  },err=>{setSync('err','Erro: '+(err.code||err.message));console.error(err)});
  // Diagnóstico: se o servidor não responder, mostrar o motivo real
  setTimeout(()=>{if(fb.estado!=='wait')return;
   q.limit(1).get({source:'server'}).then(()=>{if(fb.estado==='wait')setSync('on')})
    .catch(err=>{console.error(err);setSync('err',err.code==='permission-denied'?'Sem permissão — verifique as regras do Firestore':err.code==='unavailable'?'Servidor inacessível — verifique a internet ou se a base Firestore existe':'Erro: '+(err.code||err.message))})},8000);
 }catch(e){console.error(e);setSync('err','Firebase indisponível');fb.on=false}
}
const docId=id=>`${fb.codigo}_${id}`.replace(/\//g,'-');
function fbSet(tipo,r){if(fb.on)fb.col.doc(docId(r.id)).set({...limpo(r),_codigo:fb.codigo,_tipo:tipo}).catch(e=>toast('Erro ao sincronizar: '+e.message))}
function fbDel(id){if(fb.on)fb.col.doc(docId(id)).delete().catch(e=>toast('Erro ao sincronizar: '+e.message))}
function fbCfg(){if(fb.on)fb.col.doc(docId('_config')).set({...limpo(S.config),_codigo:fb.codigo,_tipo:'config'}).catch(e=>toast('Erro ao sincronizar: '+e.message))}
async function fbSubstituir(dados){
 const ops=[[docId('_config'),{...limpo(dados.config),_codigo:fb.codigo,_tipo:'config'}]];
 TIPOS.forEach(t=>dados[t].forEach(r=>ops.push([docId(r.id),{...limpo(r),_codigo:fb.codigo,_tipo:t}])));
 const ids=new Set(ops.map(o=>o[0])),del=[];
 (await fb.col.where('_codigo','==',fb.codigo).get()).forEach(d=>{if(!ids.has(d.id))del.push(d.ref)});
 const all=[...del.map(r=>b=>b.delete(r)),...ops.map(([id,v])=>b=>b.set(fb.col.doc(id),v))];
 for(let i=0;i<all.length;i+=400){const b=fb.col.firestore.batch();all.slice(i,i+400).forEach(f=>f(b));await b.commit()}
 toast('Registos enviados para a base partilhada');
}

/* ---------- Eventos ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function render(){
 const v=S.config.viatura;$('#hMat').textContent=fmtMat(v.matricula)||'—';$('#hVeh').textContent=[v.marca,v.modelo].filter(Boolean).join(' ')||'Viatura';
 document.title=`Diário de Viatura — ${fmtMat(v.matricula)}`;
 $('#tabs').innerHTML=TABS.map(t=>`<button data-act="tab" data-tab="${t[0]}"${t[0]===tab?' aria-current="page"':''}>${t[1]}</button>`).join('');
 $('#view').innerHTML=V[tab]();
}
document.addEventListener('click',e=>{
 const tr=e.target.closest('tr[data-id]');if(tr&&!e.target.closest('button')){abrirForm(tr.dataset.tipo,tr.dataset.id);return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act;
 if(a==='tab'){tab=b.dataset.tab;history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0);b.scrollIntoView?.({inline:'nearest',block:'nearest'})}
 else if(a==='novo')abrirForm(b.dataset.tipo);
 else if(a==='edit')abrirForm(b.dataset.tipo,b.dataset.id);
 else if(a==='novo-seg'){const o=b.dataset.obj;const ult=S.seguros.filter(s=>s.objeto===o).slice(-1)[0];
  abrirForm('seguros',null,{objeto:o,matricula:ult?ult.matricula:(o==='viatura'?S.config.viatura.matricula:''),inicio:hoje()})}
 else if(a==='renovar-seg'){const s=S.seguros.find(x=>x.id===b.dataset.id);if(!s)return;
  abrirForm('seguros',null,{objeto:s.objeto,matricula:s.matricula,apolice:s.apolice,seguradora:s.seguradora||'',premio:s.premio??null,inicio:maisUmDia(s.fim),fim:maisUmDia(s.fim,1).replace(/(\d{4}-\d{2}-\d{2})/,d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`})})}
 else if(a==='rubricar')abrirRubrica(b.dataset.tipo,b.dataset.id);
 else if(a==='entrada')abrirForm('viagens',b.dataset.id,{dataEntrada:hoje(),horaEntrada:agora()});
 else if(a==='sub'){subMan=b.dataset.sub;render()}
 else if(a==='print-diario')imprimirDiario();
 else if(a==='print-resumo')imprimirResumo();
 else if(a==='print-vista')imprimirVista();
 else if(a==='limpar-f'){const k=b.dataset.key,o=k==='viagens'?F:FT[k];Object.keys(o).forEach(x=>o[x]='');render()}
 else if(a==='exp-json')descarregar(nomeBase()+'.json',JSON.stringify(S,null,1),'application/json');
 else if(a==='imp-json')$('#fileIn').click();
 else if(a==='exp-xlsx')exportXlsx();
 else if(a==='cfg-save')guardarCfg();
 else if(a==='fb-push'){const n=TIPOS.reduce((s,t)=>s+S[t].length,0);if(!fb.on){alert('A sincronização não está ligada.');return}
  if(confirm(`Enviar os ${n} registos deste equipamento para a base partilhada? Os registos que lá estão serão substituídos por estes.`))fbSubstituir(S).catch(e=>alert('Erro ao enviar: '+(e.code||e.message)))}
 else if(a==='seed'){if(!confirm('Repor os registos originais importados do Excel neste equipamento? As alterações feitas depois (incluindo rubricas) perdem-se neste equipamento.'))return;
  S=norm(JSON.parse(JSON.stringify(SEED)));saveLocal();render();toast('Registos originais repostos');
  if(fb.on&&confirm('Enviar também estes registos para a base partilhada?'))fbSubstituir(S).catch(e=>alert('Erro ao enviar: '+(e.code||e.message)))}
 else if(a==='fb-on'){try{const t=$('#f_fbcfg').value,m=t.match(/\{[\s\S]*\}/);if(!m)throw 0;const config=(new Function('return ('+m[0]+')'))();
   const codigo=$('#f_fbcod').value.trim().replace(/[^\w-]/g,'');if(!config.projectId)throw 0;if(!codigo){alert('Indique um código de equipa (letras, números, - ou _).');return}
   localStorage.setItem(LSFB,JSON.stringify({config,codigo}));location.reload()}catch(err){alert('A configuração do Firebase não é válida. Cole o objeto firebaseConfig completo, com projectId.')}}
 else if(a==='fb-off'){if(confirm('Desligar a sincronização neste equipamento? Os registos continuam guardados aqui.')){localStorage.setItem(LSFB,'"off"');location.reload()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest?.('tr[data-id]');if(tr)abrirForm(tr.dataset.tipo,tr.dataset.id)}});
document.addEventListener('change',e=>{const ff=e.target.dataset.ff;if(ff){const[k,x]=ff.split('.');FT[k][x]=e.target.value;render();return}
 const f=e.target.dataset.filter;if(f&&f!=='q'){F[f]=e.target.value;render()}if(e.target.dataset.act==='ano-res'){anoRes=e.target.value;render()}});
document.addEventListener('input',e=>{const fq=e.target.dataset.ffq;if(fq){FT[fq].q=e.target.value;const p=e.target.selectionStart;render();const i=document.querySelector(`[data-ffq="${fq}"]`);if(i){i.focus();i.setSelectionRange(p,p)}return}
 if(e.target.dataset.filter==='q'){F.q=e.target.value;const p=e.target.selectionStart;render();const i=document.querySelector('[data-filter=q]');i.focus();i.setSelectionRange(p,p)}});
function guardarCfg(){
 const g=id=>$('#f_'+id).value,lin=s=>s.split('\n').map(x=>x.trim()).filter(Boolean),c=S.config;
 c.viatura={marca:g('marca').trim(),modelo:g('modelo').trim(),matricula:g('matricula').trim().toUpperCase()};
 const cats=lin(g('categorias')),pags=lin(g('pagamentos'));if(!cats.length){alert('Indique pelo menos uma categoria.');return}
 c.categorias=cats;c.pagamentos=pags.length?pags:c.pagamentos;c.pagamentoOrcamento=g('pagamentoOrcamento');
 const orc={};for(const l of lin(g('orcamento'))){const m=l.match(/^(\d{4})\s*[:=;]\s*([\d.,\s]+)/);if(!m){alert(`Linha de orçamento inválida: "${l}". Use o formato 2026: 1140`);return}orc[m[1]]=Number(m[2].replace(/\s/g,'').replace(',','.'))}
 c.orcamento=orc;c.inspecaoDias=Number(g('inspecaoDias'))||30;c.cartaAvisoDias=Number(g('cartaAvisoDias'))||60;
 saveLocal();fbCfg();render();toast('Definições guardadas');
}
(()=>{const tip=$('#tip');
 const show=el=>{tip.textContent=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(innerWidth-w-8,x));let y=r.top-h-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px'};
 const hide=()=>tip.classList.remove('on');
 document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');el?show(el):hide()});
 document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');el?show(el):hide()});
 document.addEventListener('scroll',hide,true);
})();
render();setSync('local');fbIniciar();
</script>
